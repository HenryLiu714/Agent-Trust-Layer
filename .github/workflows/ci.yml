name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole workflow before it publishes, so a tag is tested where it points.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.14 is what .python-version pins for development; 3.12 is the floor pyproject promises.
        # `+gil`, because mitmproxy's dependencies do not build on a free-threaded 3.14.
        python: ["3.14+gil", "3.12"]
        # 3.13 is a classifier too; one Linux leg is enough to keep that claim true.
        include:
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 120 || 30 }}
    # Every uv command has to see the matrix version. `--python` on `uv sync` alone is not enough:
    # the next `uv run` follows .python-version and rebuilds the venv on 3.14.
    env:
      UV_PYTHON: ${{ matrix.python }}
      COVERAGE_LEG: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14+gil' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      # All groups, so the tests that drive the real stripe and slack-sdk clients run, not skip.
      - run: uv sync --locked --all-groups
      - run: uv run python -c "import sys; v = '%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python }}'.removesuffix('+gil'), v"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - if: env.COVERAGE_LEG != 'true'
        run: uv run pytest -n auto
      # One leg measures coverage and reports it on the run's summary page; there is no threshold.
      - if: env.COVERAGE_LEG == 'true'
        run: uv run pytest -n auto --cov --cov-report=term
      - if: env.COVERAGE_LEG == 'true'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # Secret scanning over the commits a push or a pull request brings. `.gitleaks.toml` allows the
  # synthetic credentials the tests and the sample workflows use.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job can only read: a finding fails the check rather than commenting on the PR.
          GITLEAKS_ENABLE_COMMENTS: false

  # The wheel and sdist build, pass twine's checks, and the wheel installs and runs on its own.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel in a clean 3.12 venv
        run: scripts/smoke-test-wheel.sh dist/*.whl
