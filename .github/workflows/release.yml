name: release

# Publishes irimi to PyPI when a `v<version>` tag is pushed (#169). It uses PyPI Trusted
# Publishing: PyPI trusts this workflow's OIDC token, so no API token exists anywhere. The
# publisher on PyPI names this repository, this file and the `pypi` environment; renaming any of
# them breaks publishing until the publisher is updated to match.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # A tag that disagrees with pyproject.toml would publish a version nobody tagged.
      - name: Tag matches the package version
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: uv publish --trusted-publishing always
