[project]
name = "irimi"
version = "0.1.0"
description = "Shadow mode for AI agents: reads are real, writes are virtual, and reads see the writes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Henry Liu" }]
keywords = ["ai-agents", "llm", "shadow-mode", "proxy", "mitmproxy", "testing", "stripe", "slack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
requires-python = ">=3.12" # floor for end users; development pins 3.14 via .python-version
dependencies = [
    "cryptography>=42",
    # >=12 because `IrimiAddon.request` is a coroutine hook, and only 12's addonmanager awaits one
    # (`inspect.iscoroutinefunction` in `invoke_addon`). On 11 the decision would never run (#45).
    # <13 because the addon depends on mitmproxy's hook internals. 12.2.1 is the lowest 12 that
    # resolves with the other floors.
    "mitmproxy>=12.2.1,<13",
    # Imported directly to decode a body incrementally, up to a cap (#94). mitmproxy depends on both;
    # >=1.2 because only 1.2's `Decompressor.process` takes `output_buffer_limit`.
    "brotli>=1.2",
    "pyyaml>=6",
    "zstandard>=0.25",
]

[project.scripts]
irimi = "irimi.cli:main"

[project.urls]
Homepage = "https://github.com/HenryLiu714/Irimi"
Source = "https://github.com/HenryLiu714/Irimi"
Issues = "https://github.com/HenryLiu714/Irimi/issues"
Documentation = "https://github.com/HenryLiu714/Irimi#readme"
Changelog = "https://github.com/HenryLiu714/Irimi/blob/main/CHANGELOG.md"

[dependency-groups]
# `uv sync` installs `dev` by default. `examples` is opt-in: `uv sync --group examples`.
dev = [
    "httpx>=0.28.1",
    "mypy>=1.11",
    "pytest>=8",
    "requests>=2.34.2",
    "ruff>=0.6",
    "types-pyyaml>=6",
]
examples = [
    "slack-sdk>=3",
    "stripe>=10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irimi"]

# The sdist is what a wheel builds from, nothing more: no tests, examples, CI or agent settings.
[tool.hatch.build.targets.sdist]
include = ["/src/irimi", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A live test calls a real service, so a key exported in the shell must not make a plain run do it.
addopts = ["-m", "not live"]
markers = ["live: calls a real service with your keys; run with `uv run pytest -m live`"]
filterwarnings = [
    # mitmproxy's flow filter still calls pyparsing's pre-3.0 names; nothing in irimi does.
    "ignore:.*deprecated.*:DeprecationWarning:mitmproxy",
    "ignore:.*deprecated.*:DeprecationWarning:pyparsing",
    "ignore:.*deprecated.*:DeprecationWarning:ldap3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
# E/F/I/UP: errors, pyflakes, import order, modern syntax. B: bugbear's likely-bug patterns.
# C4: comprehension hygiene.
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = false
