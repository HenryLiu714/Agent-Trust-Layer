# OpenAI. `llm` is a route kind here, never a host default: on an LLM host only the inference
# routes are `llm`, because everything else on api.openai.com may be a real, billable write.
# `default_kind: llm` is refused by the loader for exactly that reason.
#
# Deliberately unlisted, so the RFC fallback makes them `unknown` + `unclassified` and irimi answers
# them locally: /v1/files, /v1/batches, /v1/fine_tuning/jobs, /v1/vector_stores, /v1/assistants.
# Uploading a training file or starting a fine-tune costs money and leaves state behind; a POST irimi
# has not classified is faked, not forwarded.
#
# `match:` is written in block style on purpose: a YAML flow mapping cannot hold a plain scalar
# containing `{`, so `match: {method: GET, path: /v1/models/{model}}` is a parse error.
version: 1
service: openai
style: rest # OpenAI reads are GETs, so the HTTP method carries information here
hosts:
  - api.openai.com
# `compare_ignores:` on each inference route names the top-level body fields that say who asked
# and how the answer travels, never what was asked. A replay matches a call without them, and
# `irimi compare` ignores them.
routes:
  - match:
      method: POST
      path: /v1/chat/completions
    operation: chat.completions.create
    kind: llm
    human: chat completion with {model}
    compare_ignores: [metadata, user, stream, stream_options, prompt_cache_key]

  - match:
      method: POST
      path: /v1/responses
    operation: responses.create
    kind: llm
    human: response with {model}
    compare_ignores: [metadata, user, stream, stream_options, prompt_cache_key]

  - match:
      method: POST
      path: /v1/embeddings
    operation: embeddings.create
    kind: llm
    human: embed with {model}
    compare_ignores: [metadata, user, stream, stream_options, prompt_cache_key]

  # A models listing is not inference, so it is a `read`, not `llm`. Only `read` routes have a
  # run's faked writes applied to their answers.
  - match:
      method: GET
      path: /v1/models
    operation: models.list
    kind: read
    human: list models
