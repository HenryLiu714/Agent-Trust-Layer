# Slack's Web API. Its SDKs send every call as POST, so the HTTP method says nothing about what a
# call does and the operation is the path's method name (`/api/chat.postMessage`). That is what
# `verbs: post-only` means: the loader's "a read on an unsafe method is a downgraded write" rule
# does not apply here, because there is no honest verb to downgrade from.
#
# hooks.slack.com (incoming webhooks) is here, under the same service name, because the URL itself
# is the credential: `/services/{team}/{bot}/{token}` carries the secret in the path. That route is
# always answered locally and must never be allow-listed around, which is why it is a `write` with
# no target and a comment saying so.
#
# Quote any `human:` template containing `#`. An unquoted `#` preceded by a space starts a YAML
# comment, which silently truncates the template at the channel name.
version: 1
service: slack
verbs: post-only
hosts:
  - slack.com
  - files.slack.com # file downloads; no routes yet, but the reverse door may reach it
  - hooks.slack.com # incoming webhooks; the URL is the credential
routes:
  - match:
      method: POST
      path: /api/chat.postMessage
    operation: chat.postMessage
    kind: write
    human: 'post to #{channel}: "{text}"'

  - match:
      method: POST
      path: /api/reactions.add
    operation: reactions.add
    kind: write
    human: "add :{name}: to a message in {channel}"

  - match:
      method: POST
      path: /api/files.upload
    operation: files.upload
    kind: write
    human: upload {filename} to {channels}

  - match:
      method: POST
      path: /services/{team}/{bot}/{token}
    operation: incoming_webhook
    kind: write
    human: 'post via webhook: "{text}"'
    # The webhook URL is the credential, so this route is always answered locally. When #16 lands,
    # a target here must be loopback and --allow-target-host must not apply to it.
    comment: the URL is the credential; never forwarded, never allow-listed

  - match:
      method: POST
      path: /api/conversations.history
    operation: conversations.history
    kind: read
    human: "read the #{channel} history"

  - match:
      method: POST
      path: /api/conversations.replies
    operation: conversations.replies
    kind: read
    human: "read a thread in #{channel}"

  - match:
      method: POST
      path: /api/conversations.info
    operation: conversations.info
    kind: read
    human: "look up #{channel}"

  - match:
      method: POST
      path: /api/conversations.list
    operation: conversations.list
    kind: read
    human: list channels

  - match:
      method: POST
      path: /api/auth.test
    operation: auth.test
    kind: read
    human: check the Slack token

  - match:
      method: POST
      path: /api/users.info
    operation: users.info
    kind: read
    human: look up user {user}
