# Slack's Web API. Its SDKs send every call as POST, so the HTTP method says nothing about what a
# call does and the operation is the path's method name (`/api/chat.postMessage`). That is what
# `verbs: post-only` means: the loader's "a read on an unsafe method is a downgraded write" rule
# does not apply here, because there is no honest verb to downgrade from.
#
# hooks.slack.com (incoming webhooks) is here, under the same service name, because the URL itself
# is the credential: `/services/{team}/{bot}/{token}` carries the secret in the path. So do
# `/workflows/...` and `/triggers/...`, which this map does not list - which is why the rule is
# keyed on the HOST (`servicemap.CREDENTIAL_PATH_HOSTS`) and not on this route. Every target of
# this service must be loopback, with no `--allow-target-host` escape; keying it on the route let
# a service-level target delegate every unlisted path off the machine.
#
# Quote any `human:` template containing `#`. An unquoted `#` preceded by a space starts a YAML
# comment, which silently truncates the template at the channel name.
version: 1
service: slack
verbs: post-only
hosts:
  - slack.com
  - files.slack.com # file downloads; no routes yet, but the reverse door may reach it
  - hooks.slack.com # incoming webhooks; the URL is the credential
routes:
  - match:
      method: POST
      path: /api/chat.postMessage
    operation: chat.postMessage
    kind: write
    human: 'post to #{channel}: "{text}"'
    # The L1 payload. It nests under `message:` inside Slack's own envelope; `ok`, `channel` and
    # `ts` stay envelope-owned, and `ts` is minted rather than taken from here (#42). See
    # echo.SLACK_ENVELOPES.
    fixture: message
    # `conversations.info` on the channel, before the post is faked (#45). Only a channel spelled
    # as an id is checked; see services/slack.py.
    precondition: channel_postable

  - match:
      method: POST
      path: /api/reactions.add
    operation: reactions.add
    kind: write
    human: "add :{name}: to a message in {channel}"

  - match:
      method: POST
      path: /api/files.upload
    operation: files.upload
    kind: write
    human: upload {filename} to {channels}
    # No `fixture:`. Slack retired files.upload in March 2025 and slack_sdk uploads through
    # files.getUploadURLExternal instead, so faking the `file` object here would fake a method
    # nothing calls. The route stays mapped so the call is still named and still never forwarded,
    # and echo.SLACK_ENVELOPES still knows the bare `{ok}` it answers with (#42).

  - match:
      method: POST
      path: /services/{team}/{bot}/{token}
    operation: incoming_webhook
    kind: write
    human: 'post via webhook: "{text}"'
    # The webhook URL is the credential. The rule that keeps it local lives on the host, not on
    # this route: see CREDENTIAL_PATH_HOSTS. Listing the route here is what names the operation.
    comment: the URL is the credential; never forwarded, never allow-listed

  - match:
      method: POST
      path: /api/conversations.history
    operation: conversations.history
    kind: read
    human: "read the #{channel} history"

  - match:
      method: POST
      path: /api/conversations.replies
    operation: conversations.replies
    kind: read
    human: "read a thread in #{channel}"

  - match:
      method: POST
      path: /api/conversations.info
    operation: conversations.info
    kind: read
    human: "look up #{channel}"

  - match:
      method: POST
      path: /api/conversations.list
    operation: conversations.list
    kind: read
    human: list channels

  - match:
      method: POST
      path: /api/auth.test
    operation: auth.test
    kind: read
    human: check the Slack token

  - match:
      method: POST
      path: /api/users.info
    operation: users.info
    kind: read
    human: look up user {user}
