# Stripe, derived from the SDK spec's `x-stripeOperations.method_type`: `list` and `retrieve` are
# reads, `create`, `update` and `delete` are writes. Covers charges, refunds, customers, payment
# intents and balance transactions. An unlisted write is faked as `unknown`; an unlisted GET is a
# read and is forwarded. To add a route, copy the nearest one and name its `operation:` after the
# spec's. No route here sets a `target:`; set one in ./irimi.maps.yaml or with `--target`.
#
# `match:` is written in block style on purpose: a YAML flow mapping cannot hold a plain scalar
# containing `{`, so `match: {method: GET, path: /v1/charges/{charge}}` is a parse error.
version: 1
service: stripe
style: rest # Stripe reads are GETs, so the HTTP method carries information here
hosts:
  - api.stripe.com
  - connect.stripe.com
  - files.stripe.com
  - meter-events.stripe.com
routes:
  - match:
      method: GET
      path: /v1/charges
    operation: charges.list
    kind: read
    human: list charges

  - match:
      method: GET
      path: /v1/charges/{charge}
    operation: charges.retrieve
    kind: read
    human: get charge {charge}

  - match:
      method: POST
      path: /v1/refunds
    operation: refunds.create
    kind: write
    # `:money` prints the field as an amount in minor units of the charge's currency.
    human: refund {amount:money} on {charge}
    # The response object a faked write starts from: an entry in `irimi/fixtures/stripe.json`.
    # Without it the write is answered with an echo of its own fields.
    fixture: refund
    # Checked against the real charge, with this run's own faked refunds applied to it, before
    # the refund is faked.
    precondition: charge_refundable
    # The webhooks Stripe would have sent had this refund been real. They are recorded as
    # `would_fire` and listed in the summary; nothing delivers them.
    fires:
      - refund.created
      - charge.refunded
    ids:
      id: re_
      balance_transaction: txn_

  - match:
      method: GET
      path: /v1/refunds
    operation: refunds.list
    kind: read
    human: list refunds

  - match:
      method: GET
      path: /v1/refunds/{refund}
    operation: refunds.retrieve
    kind: read
    human: get refund {refund}

  - match:
      method: GET
      path: /v1/customers/{customer}
    operation: customers.retrieve
    kind: read
    human: get customer {customer}

  - match:
      method: POST
      path: /v1/customers/{customer}
    operation: customers.update
    kind: write
    human: update customer {customer}
    fixture: customer
    fires:
      - customer.updated
    ids:
      id: cus_

  - match:
      method: GET
      path: /v1/payment_intents/{payment_intent}
    operation: payment_intents.retrieve
    kind: read
    human: get payment intent {payment_intent}

  - match:
      method: POST
      path: /v1/payment_intents/{payment_intent}/cancel
    operation: payment_intents.cancel
    kind: write
    human: cancel {payment_intent}
    fixture: payment_intent
    fires:
      - payment_intent.canceled
    ids:
      id: pi_

  - match:
      method: GET
      path: /v1/balance_transactions/{balance_transaction}
    operation: balance_transactions.retrieve
    kind: read
    human: get balance transaction {balance_transaction}
