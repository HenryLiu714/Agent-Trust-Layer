# The observability backends an agent's own SDKs talk to: tracing, error reporting and product
# analytics. One file, one YAML document per vendor, because each vendor is its own service name.
#
# Telemetry is forwarded live in every mode and is never written to the trace store: a recording of
# the agent's own observability traffic is noise, and replaying it would re-emit someone else's
# events (#9). It is counted in its own bucket in the run summary, not as a read or a write.
#
# **No document here sets `default_kind: telemetry`, and none can.** `ShadowPolicy` forwards
# `telemetry` live exactly like `read`, so a service-wide default would forward every unlisted
# route on these hosts to the real API - which is why the loader now refuses a `default_kind`
# naming any kind in `exchange.LIVE_KINDS`, `telemetry` included (#30). It is not theoretical: five
# of these six vendors serve their REST control plane from the same host as their intake, so
# `DELETE api.datadoghq.com/api/v1/dashboard/{id}` was performed for real under `irimi shadow`, and
# the `_finish` telemetry guard kept it out of the trace as well. Intake paths are listed route by
# route instead; anything unlisted falls to the RFC fallback, so an unsafe method is faked and
# flagged `unclassified`. Adding a vendor means adding its intake routes, never a default.
#
# Several hosts here are wildcard patterns (`*.ingest.sentry.io`), because these vendors hand every
# project its own subdomain. A pattern classifies traffic through the forward door only: it is not
# a reverse-door allow-list entry, so reaching one through `http://127.0.0.1:4000/<host>/...` needs
# an explicit `--allow-host <host>`. Quote every wildcard: a bare `*` opens a YAML alias.
version: 1
service: langsmith
verbs: honest
hosts:
  - api.smith.langchain.com
routes:
  - match:
      method: POST
      path: /runs/batch
    operation: runs.batch
    kind: telemetry
    human: send a batch of LangSmith runs

  - match:
      method: POST
      path: /runs/multipart
    operation: runs.multipart
    kind: telemetry
    human: send a multipart batch of LangSmith runs

  - match:
      method: POST
      path: /runs
    operation: runs.create
    kind: telemetry
    human: send a LangSmith run

  - match:
      method: PATCH
      path: /runs/{run}
    operation: runs.update
    kind: telemetry
    human: update LangSmith run {run}
    # A live-forwarded kind on a destructive verb has to say why it is safe to perform for real.
    # This PATCH closes out a trace run the agent itself opened seconds earlier - it writes
    # end_time and outputs onto LangSmith's own record of this run and touches nothing the agent
    # can later read back as application state. Not forwarding it would leave every traced run
    # open forever.
    persists: false
    comment: closes out the agent's own trace run; no application state

---
version: 1
service: langfuse
verbs: honest
hosts:
  # The shared cloud host is listed exactly as well as by pattern, so the common case resolves
  # without walking the suffixes. An exact host always beats a pattern.
  - cloud.langfuse.com
  - "*.langfuse.com"
routes:
  - match:
      method: POST
      path: /api/public/ingestion
    operation: public.ingestion
    kind: telemetry
    human: send a batch of Langfuse events

  - match:
      method: POST
      path: /api/public/otel/v1/traces
    operation: public.otel.traces
    kind: telemetry
    human: send OTLP traces to Langfuse

---
version: 1
service: sentry
verbs: honest
hosts:
  # Sentry split ingest by region in 2024. A DSN issued since then is `o<org>.ingest.us.sentry.io`,
  # which ends in `.ingest.us.sentry.io` and not in `.ingest.sentry.io`, so the legacy pattern
  # misses it; both regions are listed rather than widening to `*.sentry.io`, because sentry.io is
  # also the web app, whose REST control plane would then default to telemetry (#25, #30).
  - "*.ingest.sentry.io"
  - "*.ingest.us.sentry.io"
  - "*.ingest.de.sentry.io"
routes:
  - match:
      method: POST
      path: /api/{project}/envelope/
    operation: envelope.send
    kind: telemetry
    human: send a Sentry envelope for project {project}

  - match:
      method: POST
      path: /api/{project}/store/
    operation: store.send
    kind: telemetry
    human: send a Sentry event for project {project}

  - match:
      method: POST
      path: /api/{project}/minidump/
    operation: minidump.send
    kind: telemetry
    human: send a Sentry minidump for project {project}

  - match:
      method: POST
      path: /api/{project}/security/
    operation: security.send
    kind: telemetry
    human: send a Sentry security report for project {project}

