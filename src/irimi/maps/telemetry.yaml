version: 1
service: datadog
verbs: honest
hosts:
  - "*.datadoghq.com"
routes:
  - match:
      method: POST
      path: /api/v2/logs
    operation: logs.submit
    kind: telemetry
    human: submit logs to Datadog

  - match:
      method: POST
      path: /api/v1/series
    operation: series.submit.v1
    kind: telemetry
    human: submit metrics to Datadog

  - match:
      method: POST
      path: /api/v2/series
    operation: series.submit.v2
    kind: telemetry
    human: submit metrics to Datadog

  - match:
      method: POST
      path: /api/v1/check_run
    operation: check_run.submit
    kind: telemetry
    human: submit a service check to Datadog

  - match:
      method: POST
      path: /api/v0.2/traces
    operation: traces.submit
    kind: telemetry
    human: submit traces to Datadog

---
version: 1
service: honeycomb
verbs: honest
hosts:
  - api.honeycomb.io
routes:
  - match:
      method: POST
      path: /1/batch/{dataset}
    operation: batch.send
    kind: telemetry
    human: send a batch of events to {dataset}

  - match:
      method: POST
      path: /1/events/{dataset}
    operation: event.send
    kind: telemetry
    human: send an event to {dataset}

---
version: 1
service: posthog
verbs: honest
hosts:
  # One pattern covers the regional ingest hosts too: a pattern matches one *or more* leading
  # labels, so `*.posthog.com` already matches `eu.i.posthog.com`. A second `*.i.posthog.com`
  # resolved to this same map and matched nothing the shorter one missed (#29).
  - "*.posthog.com"
routes:
  - match:
      method: POST
      path: /batch/
    operation: batch.capture
    kind: telemetry
    human: capture a batch of PostHog events

  - match:
      method: POST
      path: /capture/
    operation: event.capture
    kind: telemetry
    human: capture a PostHog event

  - match:
      method: POST
      path: /e/
    operation: event.capture.short
    kind: telemetry
    human: capture a PostHog event

  - match:
      method: POST
      path: /i/v0/e/
    operation: event.capture.v0
    kind: telemetry
    human: capture a PostHog event
